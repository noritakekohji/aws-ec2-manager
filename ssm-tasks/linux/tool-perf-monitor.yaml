name: "[tools] パフォーマンス計測"
description: perf-monitor を実行する。COMMAND=status/start/stop/report/list。start は計測を開始して即戻るため、停止・レポートは別実行で行う
output: text
timeout: 900
script: |
  # POSIX sh の範囲で書く(SSM がシェバンを無視して /bin/sh で実行することがある)
  OPS_ROOT=/opt/ops-scripts
  TOOL_ID=perf-monitor
  # status : 現在の計測状態を表示(既定)
  # start  : バックグラウンド計測を開始して即戻る(INTERVAL / DURATION を指定)
  # stop   : 計測を停止
  # report : 収集済みセッションから HTML レポートを生成(SESSION_DIR を指定)
  # list   : セッション一覧
  COMMAND=status
  SESSION_DIR=""
  INTERVAL=""
  DURATION=""
  FROM=""
  TO=""

  set -u
  export HOME="${HOME:-/root}"
  LAUNCHER="${OPS_ROOT}/local-tools-launcher.sh"
  if [ ! -f "$LAUNCHER" ]; then
    echo "[FAIL] launcher not found: $LAUNCHER" >&2
    exit 2
  fi

  set -- run "$TOOL_ID" --set "command=${COMMAND}"
  [ -n "$SESSION_DIR" ] && set -- "$@" --set "sessionDir=${SESSION_DIR}"
  [ -n "$INTERVAL" ]    && set -- "$@" --set "interval=${INTERVAL}"
  [ -n "$DURATION" ]    && set -- "$@" --set "duration=${DURATION}"
  [ -n "$FROM" ]        && set -- "$@" --set "from=${FROM}"
  [ -n "$TO" ]          && set -- "$@" --set "to=${TO}"

  RUN_DIR=$(bash "$LAUNCHER" "$@")
  RC=$?

  echo "=== ${TOOL_ID} ${COMMAND} @ $(hostname) ==="
  echo "exit code : ${RC}   (0=成功 / 1=引数不正 / 4=セッション不在 / 5=レポート生成失敗 / 10=前提コマンド不足)"
  echo "run dir   : ${RUN_DIR}"
  if [ -z "$RUN_DIR" ] || [ ! -d "$RUN_DIR" ]; then exit "${RC}"; fi

  echo
  echo "--- artifacts ---"
  find "${RUN_DIR}/artifacts" -type f -printf '%10s  %p\n' | sort -k2

  echo
  echo "--- stdout.log (last 200 lines) ---"
  tail -n 200 "${RUN_DIR}/stdout.log"

  echo
  echo "--- stderr.log (last 50 lines) ---"
  tail -n 50 "${RUN_DIR}/stderr.log"
  exit "${RC}"
