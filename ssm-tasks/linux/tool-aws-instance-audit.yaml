name: "[tools] AWS インスタンス構成監査"
description: aws-instance-audit を実行し JSON / HTML をサーバ側に生成する。インスタンス自身の IAM ロールに EC2/IAM の参照権限が必要
output: text
timeout: 1800
script: |
  # POSIX sh の範囲で書く(SSM がシェバンを無視して /bin/sh で実行することがある)
  OPS_ROOT=/opt/ops-scripts
  TOOL_ID=aws-instance-audit
  CATEGORY=all
  REGION=""   # 空ならインスタンスのリージョンを IMDS から解決

  set -u
  export HOME="${HOME:-/root}"
  LAUNCHER="${OPS_ROOT}/local-tools-launcher.sh"
  if [ ! -f "$LAUNCHER" ]; then
    echo "[FAIL] launcher not found: $LAUNCHER" >&2
    exit 2
  fi

  set -- run "$TOOL_ID" \
    --set "category=${CATEGORY}" \
    --set "html=true"
  [ -n "$REGION" ] && set -- "$@" --set "region=${REGION}"

  RUN_DIR=$(bash "$LAUNCHER" "$@")
  RC=$?

  echo "=== ${TOOL_ID} @ $(hostname) ==="
  echo "exit code : ${RC}   (0=成功 / 1=引数不正 / 2=IMDS 到達不可 / 5=出力失敗 / 10=前提コマンド不在)"
  echo "run dir   : ${RUN_DIR}"
  if [ -z "$RUN_DIR" ] || [ ! -d "$RUN_DIR" ]; then exit "${RC}"; fi

  echo
  echo "--- artifacts ---"
  find "${RUN_DIR}/artifacts" -type f -printf '%10s  %p\n' | sort -k2

  echo
  echo "--- stdout.log (last 200 lines) ---"
  tail -n 200 "${RUN_DIR}/stdout.log"

  echo
  echo "--- stderr.log (last 50 lines) ---"
  tail -n 50 "${RUN_DIR}/stderr.log"

  # exit 2 が出る場合は IMDS 無効か EC2 外実行。
  # AccessDenied が出る場合は「インスタンスロール」タブで参照権限を確認する。
  exit "${RC}"
