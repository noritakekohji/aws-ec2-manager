name: "[雛形] tools/ ツール実行"
description: 配備済み tools/ のスクリプトを直接実行する雛形。HTML 等の成果物はサーバ側に残り、SSM には実行サマリだけ返る
output: text
timeout: 900
script: |
  # ======================================================================
  # ここだけ書き換えて使う
  # ======================================================================
  $OpsRoot   = 'C:\ops-scripts'                 # tools\ の配備先(親ディレクトリ)
  $ToolId    = 'cert-check'                     # tools\tool-catalog.yaml の id
  $EntryRel  = 'cert-check\CertCheck.ps1'       # 同 windowsPath
  $TailOut   = 200                              # SSM に返す stdout.log の末尾行数
  $TailErr   = 50
  # ======================================================================

  $ErrorActionPreference = 'Stop'
  $ToolsRoot = Join-Path $OpsRoot 'tools'
  $Entry     = Join-Path $ToolsRoot $EntryRel
  $ToolDir   = Split-Path -Parent $Entry
  if (-not (Test-Path -LiteralPath $Entry)) {
      Write-Output "[FAIL] entry not found: $Entry"
      Write-Output '  tools\ 一式をこのサーバへ配備してください'
      exit 2
  }

  # run ディレクトリはローカルランチャーと同じ規約:
  #   <OpsRoot>\reports\local-tools\<tool-id>\<yyyyMMdd-HHmmss>\artifacts
  $stamp     = (Get-Date).ToString('yyyyMMdd-HHmmss')
  $RunDir    = Join-Path $OpsRoot ('reports\local-tools\{0}\{1}' -f $ToolId, $stamp)
  $Artifacts = Join-Path $RunDir 'artifacts'
  New-Item -ItemType Directory -Path $Artifacts -Force | Out-Null
  $StdoutLog = Join-Path $RunDir 'stdout.log'
  $StderrLog = Join-Path $RunDir 'stderr.log'

  # ======================================================================
  # ツール引数(ここも書き換える)
  #   カタログの {ToolDir} -> $ToolDir、{ArtifactsDir} -> $Artifacts に対応
  # ======================================================================
  $ToolArgs = @(
      '-TargetList', (Join-Path $ToolDir 'cert_targets.lst'),
      '-TimeoutSec', '10',
      '-HtmlReport', (Join-Path $Artifacts 'cert-check.html')
  )
  # 設定ファイルを環境変数で渡すツール(server-snapshot 等)はここで設定する
  #   $env:_OPS_MW_CONF = Join-Path $ToolDir 'middleware.conf'
  # ======================================================================

  $psArgs = @('-NoProfile', '-ExecutionPolicy', 'Bypass', '-File', $Entry) + $ToolArgs
  # Start-Process -ArgumentList は配列を空白で連結するだけでクォートしない。
  # パスにスペースが含まれると引数が割れるため、LocalToolsLauncher.ps1 の
  # Join-ProcessArguments と同じ規則で自前でクォートする。
  $argLine = ($psArgs | ForEach-Object {
      if ($_ -match '[\s"]') { '"' + ($_ -replace '"', '\"') + '"' } else { $_ }
  }) -join ' '
  Set-Content -LiteralPath (Join-Path $RunDir 'command.txt') -Value $argLine -Encoding UTF8

  $spParams = @{
      FilePath               = 'powershell.exe'
      ArgumentList           = $argLine
      WorkingDirectory       = $ToolDir
      RedirectStandardOutput = $StdoutLog
      RedirectStandardError  = $StderrLog
      NoNewWindow            = $true
      Wait                   = $true
      PassThru               = $true
  }
  $proc = Start-Process @spParams
  $rc = $proc.ExitCode
  # -Wait 付きでも ExitCode が null になることがある。成功と誤認しないよう失敗扱いにする
  if ($null -eq $rc) { $rc = 1 }
  Set-Content -LiteralPath (Join-Path $RunDir 'exit-code.txt') -Value $rc -Encoding UTF8

  Write-Output "=== $ToolId @ $env:COMPUTERNAME ==="
  Write-Output ("exit code : {0}   (意味はツールごとに異なる。README の終了コード表を参照)" -f $rc)
  Write-Output "run dir   : $RunDir"

  Write-Output ''
  Write-Output '--- artifacts (このサーバ上に残ります) ---'
  Get-ChildItem -LiteralPath $Artifacts -Recurse -File -ErrorAction SilentlyContinue |
      ForEach-Object { '{0,10}  {1}' -f $_.Length, $_.FullName }

  Write-Output ''
  Write-Output ("--- stdout.log (last {0} lines) ---" -f $TailOut)
  if (Test-Path -LiteralPath $StdoutLog) { Get-Content -LiteralPath $StdoutLog -Tail $TailOut }

  Write-Output ''
  Write-Output ("--- stderr.log (last {0} lines) ---" -f $TailErr)
  if (Test-Path -LiteralPath $StderrLog) { Get-Content -LiteralPath $StderrLog -Tail $TailErr }

  # 注意:
  # - SSM の応答は 24,000 文字で打ち切られる。HTML は上の artifacts のパスを
  #   サーバ上で直接参照するか、別途ファイル転送で持ち帰ること
  # - ツール出力に日本語が含まれる場合、コンソール既定コードページ経由になるため
  #   SSM 上の表示が化けることがある。正確な内容はサーバ上の stdout.log を見る
  exit $rc
