name: "[tools] AWS インスタンス構成監査"
description: aws-instance-audit を実行し JSON / HTML をサーバ側に生成する。インスタンス自身の IAM ロールに EC2/IAM の参照権限が必要
output: text
timeout: 1800
script: |
  $OpsRoot  = 'C:\ops-scripts'
  $ToolId   = 'aws-instance-audit'
  $EntryRel = 'aws-instance-audit\Get-AwsInstanceAudit.ps1'

  $Category = 'all'
  $Region   = ''   # 空ならインスタンスのリージョンを IMDS から解決

  $ErrorActionPreference = 'Stop'
  $ToolsRoot = Join-Path $OpsRoot 'tools'
  $Entry     = Join-Path $ToolsRoot $EntryRel
  $ToolDir   = Split-Path -Parent $Entry
  if (-not (Test-Path -LiteralPath $Entry)) {
      Write-Output "[FAIL] entry not found: $Entry"
      exit 2
  }

  $stamp     = (Get-Date).ToString('yyyyMMdd-HHmmss')
  $RunDir    = Join-Path $OpsRoot ('reports\local-tools\{0}\{1}' -f $ToolId, $stamp)
  $Artifacts = Join-Path $RunDir 'artifacts'
  New-Item -ItemType Directory -Path $Artifacts -Force | Out-Null
  $StdoutLog = Join-Path $RunDir 'stdout.log'
  $StderrLog = Join-Path $RunDir 'stderr.log'

  $ToolArgs = @('-Category', $Category)
  if ($Region) { $ToolArgs += @('-Region', $Region) }
  $ToolArgs += @(
      '-OutputPath', (Join-Path $Artifacts 'aws-instance-audit.json'),
      '-HtmlReport', (Join-Path $Artifacts 'aws-instance-audit.html')
  )

  $psArgs = @('-NoProfile', '-ExecutionPolicy', 'Bypass', '-File', $Entry) + $ToolArgs
  # Start-Process -ArgumentList は配列を空白で連結するだけでクォートしない。
  # パスにスペースが含まれると引数が割れるため、LocalToolsLauncher.ps1 の
  # Join-ProcessArguments と同じ規則で自前でクォートする。
  $argLine = ($psArgs | ForEach-Object {
      if ($_ -match '[\s"]') { '"' + ($_ -replace '"', '\"') + '"' } else { $_ }
  }) -join ' '
  Set-Content -LiteralPath (Join-Path $RunDir 'command.txt') -Value $argLine -Encoding UTF8

  $spParams = @{
      FilePath               = 'powershell.exe'
      ArgumentList           = $argLine
      WorkingDirectory       = $ToolDir
      RedirectStandardOutput = $StdoutLog
      RedirectStandardError  = $StderrLog
      NoNewWindow            = $true
      Wait                   = $true
      PassThru               = $true
  }
  $proc = Start-Process @spParams
  $rc = $proc.ExitCode
  # -Wait 付きでも ExitCode が null になることがある。成功と誤認しないよう失敗扱いにする
  if ($null -eq $rc) { $rc = 1 }
  Set-Content -LiteralPath (Join-Path $RunDir 'exit-code.txt') -Value $rc -Encoding UTF8

  Write-Output "=== $ToolId @ $env:COMPUTERNAME ==="
  Write-Output ("exit code : {0}   (0=成功 / 1=引数不正 / 2=IMDS 到達不可 / 5=出力失敗 / 10=前提コマンド不在)" -f $rc)
  Write-Output "run dir   : $RunDir"

  Write-Output ''
  Write-Output '--- artifacts ---'
  Get-ChildItem -LiteralPath $Artifacts -Recurse -File -ErrorAction SilentlyContinue |
      ForEach-Object { '{0,10}  {1}' -f $_.Length, $_.FullName }

  Write-Output ''
  Write-Output '--- stdout.log (last 200 lines) ---'
  if (Test-Path -LiteralPath $StdoutLog) { Get-Content -LiteralPath $StdoutLog -Tail 200 }

  Write-Output ''
  Write-Output '--- stderr.log (last 50 lines) ---'
  if (Test-Path -LiteralPath $StderrLog) { Get-Content -LiteralPath $StderrLog -Tail 50 }

  # AccessDenied が出る場合は「インスタンスロール」タブで参照権限を確認する。
  exit $rc
