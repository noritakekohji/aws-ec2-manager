# server-snapshot middleware collection config.
# Auto-detection is the default; entries here ADD to or override detection.
# Leave list values empty (e.g. "sids =") to use auto-detection only;
# a non-empty list adds/overrides the auto-detected targets.
# %SID% in *_globs is expanded once per detected or listed SID.
#
# The default *_globs below use Linux paths. On Windows, override them with
# the corresponding drive paths (backslashes are fine). See the commented
# Windows examples under each section.

[hana]
# HANA DB is Linux-only; on Windows this section is not collected.
sids =
config_globs = /usr/sap/%SID%/SYS/global/hdb/custom/config/*.ini

[sap]
sids =
profile_globs = /usr/sap/%SID%/SYS/profile/*
# --- Windows example ---
# sids = PRD
# profile_globs = C:\usr\sap\%SID%\SYS\profile\*

[sqlserver]
instances =
connect = auto
# --- Windows example ---
# instances = MSSQLSERVER,SQLEXPRESS
# connect = auto            # auto | off (off disables sp_configure collection)

[tomcat]
bases =
config_names = server.xml,web.xml,context.xml,catalina.properties,setenv.sh,setenv.bat
# --- Windows example ---
# bases = C:\Program Files\Apache Software Foundation\Tomcat 9.0

[masking]
patterns = password,passwd,pwd,secret,key,credential,token,connectionstring

[limits]
max_file_kb = 256
