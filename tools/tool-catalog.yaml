tools:
  - id: aws-instance-audit
    name: AWS Instance Audit
    description: EC2 の IAM / SG / VPC 構成を収集
    menu: true
    windowsPath: aws-instance-audit/Get-AwsInstanceAudit.ps1
    linuxPath: aws-instance-audit/aws_instance_audit.sh
    defaultArgs: -OutputPath "{ArtifactsDir}/aws-instance-audit.json" -HtmlReport "{ArtifactsDir}/aws-instance-audit.html"
    parameters:
      - key: category
        label: カテゴリ
        type: text
        argument: -Category
        linuxArgument: -c
        default: all
      - key: region
        label: リージョン
        type: text
        width: short
        argument: -Region
        linuxArgument: -r
        default: ""
      - key: output
        label: JSON 出力
        type: hidden
        argument: -OutputPath
        linuxArgument: -o
        value: "{ArtifactsDir}/aws-instance-audit.json"
      - key: html
        label: HTML レポート
        type: checkbox
        argument: -HtmlReport
        linuxArgument: --html
        value: "{ArtifactsDir}/aws-instance-audit.html"
        default: true

  - id: cert-check
    name: Certificate Check
    description: TLS 証明書の有効期限をチェック
    menu: true
    windowsPath: cert-check/CertCheck.ps1
    linuxPath: cert-check/cert_check.sh
    defaultArgs: -TargetList "{ToolDir}/cert_targets.lst" -HtmlReport "{ArtifactsDir}/cert-check.html"
    configFiles:
      - label: cert_targets.lst
        path: cert-check/cert_targets.lst
        paramKey: targetList
    parameters:
      - key: targetList
        label: ターゲットリスト
        type: text
        argument: -TargetList
        linuxArgument: --target-list
        default: "{ToolDir}/cert_targets.lst"
      - key: timeoutSec
        label: タイムアウト秒
        type: number
        argument: -TimeoutSec
        linuxArgument: --timeout
        default: 10
      - key: html
        label: HTML レポート
        type: checkbox
        argument: -HtmlReport
        linuxArgument: --html
        value: "{ArtifactsDir}/cert-check.html"
        default: true
      - key: failOnly
        label: 失敗のみ
        type: checkbox
        argument: -FailOnly
        linuxArgument: --fail-only
        default: false

  - id: collect-snapshot
    name: Collect Snapshot
    description: サーバー断面情報を収集し ZIP 化
    menu: false
    windowsPath: collect-snapshot/CollectSnapshot.ps1
    linuxPath: collect-snapshot/collect_snapshot.sh
    defaultArgs: -Output "{ArtifactsDir}"
    parameters:
      - key: label
        label: 収集ラベル
        type: text
        argument: -Label
        linuxArgument: --label
        default: ""
      - key: output
        label: 出力先
        type: hidden
        argument: -Output
        linuxArgument: --output
        value: "{ArtifactsDir}"

  - id: collect-snapshot-report
    name: Snapshot Report
    description: 断面 ZIP から HTML レポートを生成
    menu: false
    windowsPath: collect-snapshot/ReportSnapshot.ps1
    linuxPath: ""
    defaultArgs: -OutputDir "{ArtifactsDir}"
    parameters:
      - key: zipPath
        label: ZIP パス
        type: text
        argument: -ZipPath
        default: ""
        required: true
      - key: compareWith
        label: 比較 ZIP
        type: text
        argument: -CompareWith
        default: ""
      - key: outputDir
        label: 出力先
        type: hidden
        argument: -OutputDir
        value: "{ArtifactsDir}"
      - key: includeSame
        label: 一致行も含める
        type: checkbox
        argument: -IncludeSame
        default: false

  - id: log-collector
    name: Log Collector
    description: プリセット別に障害対応ログを収集
    menu: true
    windowsPath: log-collector/LogCollector.ps1
    linuxPath: log-collector/log_collector.sh
    defaultArgs: -Target os -OutputDir "{ArtifactsDir}"
    configFiles:
      - label: collect_targets.conf
        path: log-collector/collect_targets.conf
        argName: -ConfigFile
        linuxArgName: --config
    parameters:
      - key: target
        label: プリセット
        type: text
        width: short
        argument: -Target
        linuxArgument: --targets
        default: os
      - key: since
        label: 期間
        type: text
        width: short
        argument: -Since
        linuxArgument: --since
        default: 24h
      - key: maxSizeMb
        label: 最大 MB
        type: number
        argument: -MaxSizeMB
        linuxArgument: --max-size
        default: 500
      - key: outputDir
        label: 出力先
        type: hidden
        argument: -OutputDir
        linuxArgument: --output
        value: "{ArtifactsDir}"

  - id: network-check
    name: Network Check
    description: DNS / Ping / TCP 到達性を確認
    menu: true
    windowsPath: network-check/Check-NetworkConnectivity.ps1
    linuxPath: network-check/check_network_connectivity.sh
    defaultArgs: -TargetList "{ToolDir}/targets.lst" -HtmlReport "{ArtifactsDir}/network-check.html"
    configFiles:
      - label: targets.lst
        path: network-check/targets.lst
        paramKey: targetList
    parameters:
      - key: targetList
        label: ターゲットリスト
        type: text
        argument: -TargetList
        linuxArgument: -l
        default: "{ToolDir}/targets.lst"
      - key: pingCount
        label: Ping 回数
        type: number
        argument: -PingCount
        linuxArgument: -c
        default: 3
      - key: timeoutSec
        label: タイムアウト秒
        type: number
        argument: -TimeoutSec
        linuxArgument: -t
        default: 3
      - key: html
        label: HTML レポート
        type: checkbox
        argument: -HtmlReport
        linuxArgument: -o
        value: "{ArtifactsDir}/network-check.html"
        default: true
      - key: failOnly
        label: 失敗のみ
        type: checkbox
        argument: -FailOnly
        linuxArgument: -f
        default: false

  - id: perf-monitor
    name: Performance Monitor
    description: パフォーマンスカウンタを収集・確認
    menu: true
    windowsPath: perf-monitor/PerfMonitor.ps1
    linuxPath: perf-monitor/perf_monitor.sh
    defaultArgs: status
    configFiles:
      - label: perf_monitor.conf
        path: perf-monitor/perf_monitor.conf
        argName: -Config
        linuxArgName: -c
    parameters:
      - key: command
        label: アクション
        type: select
        width: short
        argument: ""
        options: "start,stop,report,status,list"
        default: status
      - key: sessionDir
        label: セッション
        type: directory
        argument: ""
        default: ""
        tooltip: "stop / report / status の対象セッション。start 時に指定すると、そのセッションと同じ場所に新しいセッションを作る(空欄なら実行ごとのフォルダに作成)"
      - key: interval
        label: 間隔秒
        type: number
        argument: -Interval
        linuxArgument: -i
        default: ""
      - key: duration
        label: Duration 秒
        type: number
        argument: -Duration
        linuxArgument: -d
        default: ""
      - key: from
        label: 範囲開始(report用)
        type: text
        width: short
        argument: -From
        linuxArgument: -f
        default: ""
        tooltip: "report コマンド専用。ISO 8601 形式で指定(例: 2026-05-18T10:15:00)。空欄なら先頭から"
      - key: to
        label: 範囲終了(report用)
        type: text
        width: short
        argument: -To
        linuxArgument: -t
        default: ""
        tooltip: "report コマンド専用。ISO 8601 形式で指定(例: 2026-05-18T10:30:00)。空欄なら末尾まで"
      - key: outputDir
        label: 出力先
        type: hidden
        argument: -OutputDir
        linuxArgument: -o
        value: "{ArtifactsDir}"

  - id: port-inventory
    name: Port Inventory
    description: 待受ポートを棚卸し、期待値と照合
    menu: true
    windowsPath: port-inventory/PortInventory.ps1
    linuxPath: port-inventory/port_inventory.sh
    defaultArgs: -ExpectedList "{ToolDir}/expected_ports.lst" -HtmlReport "{ArtifactsDir}/port-inventory.html"
    configFiles:
      - label: expected_ports.lst
        path: port-inventory/expected_ports.lst
        paramKey: expectedList
    parameters:
      - key: expectedList
        label: 期待ポートリスト
        type: text
        argument: -ExpectedList
        linuxArgument: --expected
        default: "{ToolDir}/expected_ports.lst"
      - key: html
        label: HTML レポート
        type: checkbox
        argument: -HtmlReport
        linuxArgument: --html
        value: "{ArtifactsDir}/port-inventory.html"
        default: true
      - key: failOnly
        label: 失敗のみ
        type: checkbox
        argument: -FailOnly
        linuxArgument: --fail-only
        default: false

  - id: server-snapshot
    name: Server Snapshot
    description: サーバー構成スナップショットの収集・比較
    menu: true
    windowsPath: server-snapshot/ServerSnapshot.ps1
    linuxPath: server-snapshot/server_snapshot.sh
    defaultArgs: collect -OutputPath "{ArtifactsDir}/server-snapshot.json"
    configFiles:
      - label: middleware.conf
        path: server-snapshot/middleware.conf
        envVar: _OPS_MW_CONF
      - label: filelist.conf
        path: server-snapshot/filelist.conf
        envVar: _OPS_FILELIST_CONF
    parameters:
      - key: command
        label: アクション
        type: select
        width: short
        argument: ""
        options: "collect,before,after,compare,list"
        default: collect
      - key: category
        label: カテゴリ
        type: text
        argument: -Category
        linuxArgument: --category
        default: all
      - key: label
        label: ラベル
        type: text
        width: short
        argument: -Label
        linuxArgument: --label
        default: ""
      - key: outputPath
        label: JSON 出力
        type: hidden
        argument: -OutputPath
        linuxArgument: --output
        value: "{ArtifactsDir}/server-snapshot.json"
      - key: html
        label: HTML レポート(after/compare 時)
        type: checkbox
        argument: -HtmlReport
        linuxArgument: --html
        value: "{ArtifactsDir}/server-snapshot.html"
        default: false

  - id: file-transfer-check
    name: File Transfer Check
    description: SMB 共有への往復転送で疎通・整合性・速度を確認
    menu: false
    windowsPath: file-transfer-check/Check-FileTransfer.ps1
    linuxPath: file-transfer-check/check_file_transfer.sh
    defaultArgs: -ShareList "{ToolDir}/shares.lst"
    configFiles:
      - label: shares.lst
        path: file-transfer-check/shares.lst
        paramKey: shareList
    parameters:
      - key: shareList
        label: 共有リスト
        type: text
        argument: -ShareList
        linuxArgument: -l
        default: "{ToolDir}/shares.lst"
      - key: sizeMB
        label: テストサイズMB
        type: number
        argument: -SizeMB
        linuxArgument: -s
        default: 10
      - key: timeoutSec
        label: タイムアウト秒
        type: number
        argument: -TimeoutSec
        linuxArgument: -t
        default: 60
      - key: html
        label: HTML レポート
        type: checkbox
        argument: -HtmlReport
        linuxArgument: -o
        value: "{ArtifactsDir}/file-transfer-check.html"
        default: true
      - key: failOnly
        label: 失敗のみ
        type: checkbox
        argument: -FailOnly
        linuxArgument: -f
        default: false

  - id: env-doc
    name: Environment Document
    description: snapshot と system.yaml から環境定義書(HTML)を生成
    menu: false
    windowsPath: env-doc/EnvDoc.ps1
    linuxPath: ""
    defaultArgs: -OutputDir "{ArtifactsDir}"
    configFiles:
      - label: system.yaml
        path: env-doc/system.sample.yaml
        paramKey: systemFile
    parameters:
      - key: inputDir
        label: 入力ディレクトリ
        type: directory
        argument: -InputDir
        default: ""
        required: true
      - key: systemFile
        label: システム定義 YAML
        type: text
        argument: -SystemFile
        default: "{ToolDir}/system.sample.yaml"
      - key: outputDir
        label: 出力先
        type: hidden
        argument: -OutputDir
        value: "{ArtifactsDir}"
      - key: force
        label: 上書き
        type: checkbox
        argument: -Force
        default: false
